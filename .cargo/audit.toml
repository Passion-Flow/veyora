# cargo-audit policy (SEC-ASSURE-003). Vulnerabilities always deny; the
# advisories below are all "unmaintained" informational warnings — no
# soundness fix is available for any of them at current pin levels, and
# each maps to a transitive dependency we cannot replace unilaterally.
# Revisit on every Tauri / lockfile upgrade.

[advisories]
ignore = [
  # GTK3/-sys family: Tauri's Linux webkit2gtk bindings still require the
  # deprecated gtk3 stack; no maintained replacement exists upstream.
  "RUSTSEC-2024-0411", # gdk
  "RUSTSEC-2024-0412", # gdk-sys
  "RUSTSEC-2024-0413", # gdk-pixbuf
  "RUSTSEC-2024-0414", # gtk
  "RUSTSEC-2024-0415", # gtk-sys
  "RUSTSEC-2024-0416", # atk
  "RUSTSEC-2024-0417", # atk-sys
  "RUSTSEC-2024-0418", # gio-sys family
  "RUSTSEC-2024-0419", # proc-macro-error (gtk3-macros chain)
  "RUSTSEC-2024-0420", # gtk3-macros
  "RUSTSEC-2025-0098", # glib
  # Other unmaintained transitive crates with no fixed replacement.
  "RUSTSEC-2024-0370", # rustls-pemfile (1.x line unmaintained; 2.x is API-breaking)
  "RUSTSEC-2024-0429", # paste (proc-macro, no soundness issue)
  "RUSTSEC-2025-0075", # unic-common
  "RUSTSEC-2025-0080", # unic-ucd-ident
  "RUSTSEC-2025-0081", # unic-char-range
  "RUSTSEC-2025-0100", # unic-ucd-version
  "RUSTSEC-2025-0134", # unic-char-property
]
