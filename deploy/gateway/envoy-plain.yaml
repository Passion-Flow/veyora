# Simple HTTP proxy (no TLS) for development and CI.
# Routes all traffic to the upstream API without redirect.
static_resources:
  listeners:
    - name: plain_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: plain_proxy
                internal_address_config:
                  cidr_ranges:
                    - address_prefix: 10.0.0.0
                      prefix_len: 8
                    - address_prefix: 172.16.0.0
                      prefix_len: 12
                    - address_prefix: 192.168.0.0
                      prefix_len: 16
                route_config:
                  virtual_hosts:
                    - name: proxy
                      domains: ["*"]
                      routes:
                        # __VEYORA_GATEWAY_FAULT_BEGIN__
                        # Optional injected latency on record writes for
                        # fault drills (VEYORA_GATEWAY_DELAY_MS in the
                        # entrypoint); scoped per-route so health probes
                        # and readiness stay instant. The web proxy strips
                        # its /api/ prefix, so the gateway sees /records.
                        - match: { prefix: "/records" }
                          route:
                            cluster: upstream
                            timeout: 30s
                          typed_per_filter_config:
                            envoy.filters.http.fault:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                              delay:
                                fixed_delay: __VEYORA_GATEWAY_DELAY_S__s
                                percentage:
                                  numerator: 100
                                  denominator: HUNDRED
                        # __VEYORA_GATEWAY_FAULT_END__
                        - match: { prefix: "/" }
                          route:
                            cluster: upstream
                            timeout: 30s
                http_filters:
                  # __VEYORA_GATEWAY_FAULT_FILTER_BEGIN__
                  # No-op without a per-route delay config; removed entirely
                  # unless VEYORA_GATEWAY_DELAY_MS enables the fault drill.
                  - name: envoy.filters.http.fault
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                  # __VEYORA_GATEWAY_FAULT_FILTER_END__
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: upstream
      type: LOGICAL_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api
                      port_value: 8080

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
