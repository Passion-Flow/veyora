[package]
name = "veyora-desktop"
version = "1.0.0"
description = "Veyora desktop client shell"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
edition = "2021"

[lib]
name = "veyora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
