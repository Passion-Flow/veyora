[package]
name = "veyora-desktop"
version = "0.0.1"
description = "Veyora standalone desktop vault"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
edition = "2021"

[lib]
name = "veyora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
api = { path = "../../../backend/services/api" }
backend-persistence = { path = "../../../backend/crates/persistence" }
backend-sqlite = { path = "../../../backend/crates/sqlite" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
