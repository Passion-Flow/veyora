[package]
name = "kernel-target-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[workspace]
members = [
    "crates/kernel-core",
    "crates/kernel-ffi",
    "crates/kernel-wasm",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.93.1"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
base64ct = { version = "=1.8.3", default-features = false, features = ["alloc"] }
getrandom = { version = "=0.4.3", default-features = false }
hkdf = { version = "=0.13.0", default-features = false }
jni = { version = "=0.22.4", default-features = false }
minicbor = { version = "=2.3.0", default-features = false, features = ["alloc"] }
p256 = { version = "=0.14.0", default-features = false, features = ["alloc", "ecdsa"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.11.0", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
wasm-bindgen = { version = "=0.2.127", default-features = false, features = ["std"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[workspace.dependencies.chacha20poly1305]
version = "=0.11.0"
default-features = false
features = ["alloc", "zeroize"]

[workspace.dependencies.ed25519-dalek]
version = "=3.0.0"
default-features = false
features = ["alloc", "digest", "signature", "zeroize"]

[workspace.dependencies.hpke]
version = "=0.14.0"
default-features = false
features = ["alloc", "chacha", "hkdfsha2", "x25519"]

[dependencies]
kernel-core = { path = "crates/kernel-core" }
kernel-ffi = { path = "crates/kernel-ffi" }
kernel-wasm = { path = "crates/kernel-wasm" }

[[test]]
name = "target_parity"
path = "tests/target_parity.rs"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
