name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build / ${{ matrix.settings.label }}
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - label: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate the release identity
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="$(node -p "require('./release/version.json').tag")"
          if [[ "$RELEASE_TAG" != "$expected" ]]; then
            echo "Tag must match release/version.json ($expected)." >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"
          targets: ${{ matrix.settings.rust_targets }}
      - name: Cache the Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # swatinem/rust-cache@v2
      - name: Install the desktop tooling from the root workspace lockfile
        run: npm ci --no-audit --no-fund
      - name: Build the installers
        run: npx tauri build --target ${{ matrix.settings.target }}
        working-directory: apps/desktop
      - name: Collect the bundle artifacts
        shell: bash
        run: |
          mkdir -p bundle-out
          base="target/${{ matrix.settings.target }}/release/bundle"
          find "$base" -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) \
            -exec cp {} bundle-out/ \;
          ls -la bundle-out
      - name: Upload the bundle artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: veyora-desktop-${{ matrix.settings.label }}
          path: bundle-out/
          if-no-files-found: error
      - name: Attach the bundles to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease="$(node -p "require('./release/version.json').github_prerelease")"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)"
            if [[ "$existing" != "$prerelease" ]]; then
              echo "Existing release channel conflicts with release/version.json." >&2
              exit 1
            fi
          elif [[ "$prerelease" == "true" ]]; then
            gh release create "$tag" --generate-notes --verify-tag --prerelease
          else
            gh release create "$tag" --generate-notes --verify-tag --latest
          fi
          gh release upload "$tag" bundle-out/*
