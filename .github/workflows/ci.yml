name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate repository structure and documentation
        run: python3 tools/lint/check-repository.py
      - name: Validate manual-evidence records
        run: python3 tools/lint/check-manual-evidence.py
      - name: Validate the pairing/session contract
        run: python3 tools/lint/check-pairing-session.py
      - name: Validate foundation image pins
        run: python3 tools/lint/check-foundation-pins.py
      - name: Validate the compose network topology
        run: python3 tools/lint/check-compose-topology.py
      - name: Contract regression tests
        run: python3 -B -m unittest discover -s tests/contracts -p 'test_*.py' -v
      - name: Validate the static web client
        run: node tools/lint/check-web.mjs
      - name: Validate locale catalogs
        run: node apps/web/tools/check-locales.mjs
      - name: Unit-test the web client
        run: node --test "apps/web/test/*.test.mjs"
      - name: Test the backend projection generator
        run: python3 -B -m unittest discover -s tools/codegen/backend/tests -p 'test_*.py' -v
      - name: Lint shell scripts
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo koalaman/shellcheck:v0.11.0 \
            tools/release/publish-containers.sh \
            tools/lint/doctor.sh \
            tests/smoke/api.sh \
            tests/smoke/headers.sh \
            tests/integration/backup-restore.sh \
            deploy/tools/deploy.sh \
            packages/security-kernel/scripts/build-ffi.sh \
            packages/security-kernel/scripts/build-wasm.sh
      - name: Lint container definitions
        run: |
          for dockerfile in \
            deploy/containers/api/Dockerfile \
            deploy/containers/backup/Dockerfile \
            deploy/containers/migrator/Dockerfile \
            deploy/containers/restore/Dockerfile \
            deploy/containers/validator/Dockerfile \
            deploy/containers/worker/Dockerfile \
            deploy/containers/mirror/Dockerfile \
            deploy/gateway/Dockerfile \
            deploy/web/Dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.15.1-alpine \
              hadolint --ignore DL3066 - < "$dockerfile"
          done
      - name: Scan the public tree for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo zricethezav/gitleaks:v8.28.0 \
            dir --config .gitleaks.toml --no-banner --redact .
      - name: Lint the GitHub Actions workflows
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 \
            .github/workflows/ci.yml \
            .github/workflows/publish-images.yml \
            .github/workflows/desktop-release.yml

  kernel:
    name: Security kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
        working-directory: packages/security-kernel
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        working-directory: packages/security-kernel
      - run: cargo test --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
        working-directory: packages/security-kernel

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: Install the Linux WebView build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check generated artifacts (REPO-006/007/008)
        run: make check-codegen
      - run: cargo test --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build the WASM module without warnings
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --locked --target wasm32-unknown-unknown --lib -p kernel-wasm --release
        working-directory: packages/security-kernel
      - name: Install the matching binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Generate and execute Node.js bindings
        run: |
          wasm-bindgen --target nodejs --out-dir /tmp/veyora-wasm --out-name veyora_kernel \
            packages/security-kernel/target/wasm32-unknown-unknown/release/kernel_wasm.wasm
          VEYORA_WASM_OUT=/tmp/veyora-wasm node packages/security-kernel/tests/wasm_runtime_test.cjs
      - name: Validate the checked-in web client
        run: node tools/lint/check-web.mjs

  faults:
    name: Fault injection (429 / 5xx / latency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run the fault-injection browser suite on its own stack
        working-directory: deploy/compose
        env:
          VEYORA_DB_PASSWORD: inert-ci-password
          VEYORA_API_AUTH: disabled
          VEYORA_WEB_PORT: "3311"
          VEYORA_BUILD_COMMIT: e2e-ci-check
          VEYORA_API_RATE_LIMIT: "120"
          VEYORA_GATEWAY_DELAY_MS: "2500"
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up -d --build --wait --wait-timeout 180
          cd ../.. && npm ci --no-audit --no-fund
          VEYORA_WEB_URL=http://127.0.0.1:3311 \
            node tests/e2e/web/test-browser-faults.mjs
          cd deploy/compose && docker compose down --volumes --remove-orphans

  desktop:
    name: Desktop shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - name: Install the Linux WebView build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"
          components: rustfmt, clippy
      - name: Check formatting of the shipping desktop shell
        run: cargo fmt --all -- --check
      - name: Lint the shipping desktop shell
        run: cargo clippy --locked --all-targets -p veyora-desktop -- -D warnings
      - name: Test the shipping desktop shell
        run: cargo test --locked --all-targets -p veyora-desktop
        env:
          RUSTFLAGS: -D warnings

  compose:
    name: Compose integration
    runs-on: ubuntu-latest
    env:
      VEYORA_DB_PASSWORD: inert-ci-password
      VEYORA_API_AUTH: disabled
      # Build the stack from source without depending on published images.
      VEYORA_POSTGRES_IMAGE: postgres:16-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate the default topology
        working-directory: deploy/compose
        run: docker compose config --quiet
      - name: Validate the production-shaped topology
        working-directory: deploy/compose
        env:
          VEYORA_API_AUTH: token
          VEYORA_API_TOKEN: inert-ci-token
        run: docker compose config --quiet
      - name: Build and start the local stack
        working-directory: deploy/compose
        env:
          VEYORA_WORKER_POLL_SECONDS: "1"
          VEYORA_BUILD_COMMIT: e2e-ci-check
        run: docker compose up --build --wait --wait-timeout 180
      - name: Exercise the API and web gateway
        run: |
          ./tests/smoke/api.sh http://127.0.0.1:8080
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{content_type}' http://127.0.0.1:3000/src/wasm/veyora_kernel_bg.wasm)" = "application/wasm"
          curl --fail --silent http://127.0.0.1:3000/api/healthz >/dev/null
      - name: Install the browser test dependencies from the root workspace
        run: npm ci --no-audit --no-fund
      - name: Exercise the browser, API, and WebAssembly together
        env:
          VEYORA_WEB_URL: http://127.0.0.1:3000
          VEYORA_BUILD_COMMIT: e2e-ci-check
        run: node tests/e2e/web/test-browser.mjs
      - name: Capture first-phase service logs
        working-directory: deploy/compose
        run: docker compose logs --no-color api gateway web worker > /tmp/veyora-compose-phase1.log
      - name: Backup/wipe/restore drill against the stack PostgreSQL
        run: |
          CARGO_TARGET_DIR=.build/cargo cargo build --locked -p backup -p restore
          DATABASE_URL="postgres://veyora:${VEYORA_DB_PASSWORD}@127.0.0.1:5432/veyora" \
          VEYORA_API_URL="http://127.0.0.1:3000/api" \
          VEYORA_POSTGRES_CONTAINER="$(docker ps --format '{{.Names}}' | grep -m1 postgres)" \
          BACKUP_BIN="$PWD/.build/cargo/debug/backup" \
          RESTORE_BIN="$PWD/.build/cargo/debug/restore" \
          tests/integration/backup-restore.sh
      # Each browser suite must create its vault against a pristine store
      # (suite isolation keeps the gates blocking and deterministic). The
      # verifier itself is vault-scoped since the DATA-003 fix; isolation
      # remains hygiene, not a workaround.
      # The reset must re-pass VEYORA_BUILD_COMMIT: the web container
      # renders its config at start, and a reset without the stamp would
      # serve 'unknown' and fail the Diagnostics assertions.
      - name: Reset the data store between browser suites
        working-directory: deploy/compose
        env:
          VEYORA_DB_PASSWORD: inert-ci-password
          VEYORA_API_AUTH: disabled
          VEYORA_POSTGRES_IMAGE: postgres:16-bookworm
          VEYORA_WORKER_POLL_SECONDS: "1"
          VEYORA_BUILD_COMMIT: e2e-ci-check
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up -d --wait --wait-timeout 180
          curl --fail --silent --output /dev/null --max-time 30 \
            --retry 10 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:3000/api/healthz
      - name: Run comprehensive browser E2E
        env:
          VEYORA_WEB_URL: http://127.0.0.1:3000
          VEYORA_BUILD_COMMIT: e2e-ci-check
        run: node tests/e2e/web/test-browser-full.mjs
      - name: Reset the data store before the accessibility audit
        working-directory: deploy/compose
        env:
          VEYORA_DB_PASSWORD: inert-ci-password
          VEYORA_API_AUTH: disabled
          VEYORA_POSTGRES_IMAGE: postgres:16-bookworm
          VEYORA_WORKER_POLL_SECONDS: "1"
          VEYORA_BUILD_COMMIT: e2e-ci-check
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up -d --wait --wait-timeout 180
          curl --fail --silent --output /dev/null --max-time 30 \
            --retry 10 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:3000/api/healthz
      - name: Run the automated accessibility audit
        env:
          VEYORA_WEB_URL: http://127.0.0.1:3000
          VEYORA_BUILD_COMMIT: e2e-ci-check
        run: node tests/e2e/web/test-browser-accessibility.mjs
      - name: Reset the data store before the keyboard and focus audit
        working-directory: deploy/compose
        env:
          VEYORA_DB_PASSWORD: inert-ci-password
          VEYORA_API_AUTH: disabled
          VEYORA_POSTGRES_IMAGE: postgres:16-bookworm
          VEYORA_WORKER_POLL_SECONDS: "1"
          VEYORA_BUILD_COMMIT: e2e-ci-check
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up -d --wait --wait-timeout 180
          curl --fail --silent --output /dev/null --max-time 30 \
            --retry 10 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:3000/api/healthz
      - name: Run the keyboard and focus audit
        env:
          VEYORA_WEB_URL: http://127.0.0.1:3000
          VEYORA_BUILD_COMMIT: e2e-ci-check
        run: node tests/e2e/web/test-browser-keyboard.mjs
      - name: Reset the data store before the acceptance journeys
        working-directory: deploy/compose
        env:
          VEYORA_DB_PASSWORD: inert-ci-password
          VEYORA_API_AUTH: disabled
          VEYORA_POSTGRES_IMAGE: postgres:16-bookworm
          VEYORA_WORKER_POLL_SECONDS: "1"
          VEYORA_BUILD_COMMIT: e2e-ci-check
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up -d --wait --wait-timeout 180
      - name: Run the PRD acceptance journeys (E2E-002..007)
        env:
          VEYORA_WEB_URL: http://127.0.0.1:3000
          VEYORA_BUILD_COMMIT: e2e-ci-check
        run: node tests/e2e/web/test-browser-e2e.mjs
      - name: Verify the Connect gate against a real token-auth stack
        working-directory: deploy/compose
        env:
          VEYORA_DB_PASSWORD: inert-ci-password
          VEYORA_API_AUTH: token
          VEYORA_API_TOKEN: inert-ci-token
          VEYORA_POSTGRES_IMAGE: postgres:16-bookworm
          VEYORA_WORKER_POLL_SECONDS: "1"
          VEYORA_BUILD_COMMIT: e2e-ci-check
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up -d --wait --wait-timeout 180
      - name: Run the live token-gate verification (UX-ONB-003)
        env:
          VEYORA_WEB_URL: http://127.0.0.1:3000
          VEYORA_CONNECT_TOKEN: inert-ci-token
        run: node tests/e2e/web/verify-token-gate.mjs
      - name: Reject warnings, errors, and secret exposure in service logs
        working-directory: deploy/compose
        run: |
          docker compose logs --no-color api gateway web worker > /tmp/veyora-compose.log
          cat /tmp/veyora-compose-phase1.log >> /tmp/veyora-compose.log
          if grep -Eiq '(^|[^[:alnum:]_])(panic|fatal)([^[:alnum:]_]|$)' /tmp/veyora-compose.log; then
            echo 'Panic or fatal found in application logs.' >&2
            grep -Ein '(^|[^[:alnum:]_])(panic|fatal)([^[:alnum:]_]|$)' /tmp/veyora-compose.log >&2
            exit 1
          fi
          if grep -Fq 'inert-ci-password' /tmp/veyora-compose.log; then
            echo 'The database password appeared in service logs.' >&2
            exit 1
          fi
      - name: Show service logs after a failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color
      - name: Stop the test stack
        if: always()
        working-directory: deploy/compose
        run: docker compose down --volumes --remove-orphans
