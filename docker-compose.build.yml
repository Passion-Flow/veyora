# Source-build override for contributors and CI.
#
# The default Compose file pulls the official versioned images. Apply this
# override only when the Veyora service images must be rebuilt from source:
# docker compose -f docker-compose.yml -f docker-compose.build.yml up --build

services:
  postgres:
    image: postgres:16-bookworm

  migrator:
    image: veyora-migrator:local
    build:
      context: .
      dockerfile: backend/Dockerfile.migrator

  api:
    image: veyora-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile.api

  worker:
    image: veyora-worker:local
    build:
      context: .
      dockerfile: backend/Dockerfile.worker

  gateway:
    image: veyora-gateway:local
    build:
      context: .
      dockerfile: deployment/Dockerfile.gateway.build

  web:
    image: veyora-web:local
    build:
      context: .
      dockerfile: deployment/web/Dockerfile
