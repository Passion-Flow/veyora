title = "Veyora public-source secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Published deterministic cryptographic known-answer vectors"
paths = [
  '''^packages/security-kernel/vectors/.*\.json$''',
]

[[allowlists]]
description = "RFC 6238 Appendix B test vectors (public standard test secret)"
paths = [
  '''^apps/web/src/data/totp\.js$''',
  '''^apps/web/test/totp\.test\.mjs$''',
]

[[allowlists]]
description = "Local build artifacts (not tracked by git)"
paths = [
  '''^packages/security-kernel/target/.*''',
  '''^certs/.*''',
]

[[allowlists]]
description = "Browser E2E suite fixture passwords (inert literal test data, never a credential)"
paths = [
  '''^tests/e2e/web/.*\.mjs$''',
]
