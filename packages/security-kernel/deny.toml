[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
    "aarch64-linux-android",
]

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause"]
confidence-threshold = 0.93
exceptions = [
    { allow = ["BlueOak-1.0.0"], name = "minicbor", version = "2.3.0" },
    { allow = ["MPL-2.0"], name = "cbindgen", version = "0.29.4" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    { name = "libsodium-rs", version = "=0.2.4", reason = "blocked pending offline provenance and human license disposition" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
