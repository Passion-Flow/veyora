# Rendered at container start from environment variables (see the web
# Dockerfile and .env.example). Placeholders, no hard-coded values:
#   __VEYORA_WEB_LISTEN_PORT__   nginx listener port inside the container
#   __VEYORA_API_UPSTREAM_HOST__ / __VEYORA_API_UPSTREAM_PORT__  API backend
#   __VEYORA_WEB_PROXY_TIMEOUT_SECONDS__  upstream read timeout
server {
    listen __VEYORA_WEB_LISTEN_PORT__;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    # CSP: scripts/styles/fonts are self-contained except the Plex webfonts;
    # WASM compilation needs 'wasm-unsafe-eval'; the records API origin is
    # rendered from VEYORA_CSP_CONNECT_SRC at container start ('self' covers
    # the same-origin /api proxy used by the Compose topology).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src __VEYORA_CSP_CONNECT_SRC__; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy API requests to the API service.
    # In Docker Compose, "api" resolves to the API container on port 8080.
    location /api/ {
        proxy_pass http://__VEYORA_API_UPSTREAM_HOST__:__VEYORA_API_UPSTREAM_PORT__/;
        # Envoy requires HTTP/1.1 or newer. Nginx otherwise proxies upstream
        # requests as HTTP/1.0, which Envoy correctly rejects with HTTP 426.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout __VEYORA_WEB_PROXY_TIMEOUT_SECONDS__s;
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WASM files need correct MIME type.
    # `expires` (not add_header) so the server-level security headers above
    # stay inherited — a location with its own add_header drops them.
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        expires 365d;
    }

    # JS files
    location ~ \.js$ {
        types { application/javascript js; }
        expires 365d;
    }

    # Gzip
    gzip on;
    gzip_types text/plain application/javascript application/wasm;
    gzip_min_length 256;
}
