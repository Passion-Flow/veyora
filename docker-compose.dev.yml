# Start PostgreSQL only, then run the Rust services and static client locally:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up postgres

services:
  postgres:
    image: postgres:16-bookworm
    ports:
      - "127.0.0.1:${VEYORA_DB_PORT:-5432}:5432"

  migrator:
    profiles: ["full"]
  api:
    profiles: ["full"]
  worker:
    profiles: ["full"]
  gateway:
    profiles: ["full"]
  web:
    profiles: ["full"]
